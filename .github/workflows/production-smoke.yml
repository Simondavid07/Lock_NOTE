name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live Lock Note deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://lock-note-sigma.vercel.app
      LOCKNOTE_PRODUCTION_URL: https://lock-note-sigma.vercel.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live zero-knowledge lifecycle smoke test
        run: npm run test:live

      - name: Verify static security headers
        run: npm run test:headers
